name: flame_cli
resolution: workspace
description: A command line tool for inspecting and controlling running Flame games, for example to take snapshots of them.
version: 0.1.0
homepage: https://github.com/flame-engine/flame/tree/main/packages/flame_cli
funding:
  - https://opencollective.com/blue-fire
  - https://github.com/sponsors/bluefireteam
  - https://patreon.com/bluefireoss
topics:
  - flame
  - cli
  - debugging

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  vm_service: ^15.0.0

dev_dependencies:
  flame_lint: ^1.4.3
  test: any

executables:
  flame: flame_cli

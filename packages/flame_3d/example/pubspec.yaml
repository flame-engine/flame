name: flame_3d_example
resolution: workspace
description: An example for flame_3d. The example shows how to set up 3D support in a flame game.
version: 0.0.1+1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flame: ^2.0.0-dev.1
  flame_3d: ^0.4.0-dev.1
  flame_console: ^0.2.0-dev.1
  flutter:
    sdk: flutter

dev_dependencies:
  flame_lint: ^1.5.0-dev.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/objects/

name: flame_noise
resolution: workspace
description: Integrates the noises from the fast_noise package into Flame, with noise based effects like shakes.
version: 0.3.4-dev.1
homepage: https://github.com/flame-engine/flame/tree/main/packages/flame_noise
funding:
  - https://opencollective.com/blue-fire
  - https://github.com/sponsors/bluefireteam
  - https://patreon.com/bluefireoss
topics:
  - flame
  - noise

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  fast_noise: ^2.0.0
  flame: ^2.0.0-dev.1
  flutter:
    sdk: flutter

dev_dependencies:
  dartdoc: ^9.0.0
  flame_lint: ^1.5.0-dev.1
  flame_test: ^3.0.0-dev.1
  test: any

pana_workspace:
  warn_only:
    - All of the package dependencies are supported in the latest version
    - Package supports latest stable Dart and Flutter SDKs
    - 20% or more of the public API has dartdoc comments

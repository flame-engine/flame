name: flame_svg_example
resolution: workspace
description: Example app of how to use the flame_svg package

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flame: ^2.0.0-dev.1
  flame_svg: ^3.0.0-dev.1
  flutter:
    sdk: flutter

  material_ui: ^1.0.0
dev_dependencies:
  flame_lint: ^1.5.0-dev.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/android.svg

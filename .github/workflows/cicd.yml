name: cicd

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]


env:
  FLUTTER_MIN_VERSION: '3.47.0'

jobs:
  # BEGIN LINTING STAGE
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      - uses: bluefireteam/melos-action@v3
      - run: melos run format-check

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.FLUTTER_MIN_VERSION}}
      - uses: bluefireteam/melos-action@v3
      - name: "Analyze with lowest supported version"
        uses: invertase/github-action-dart-analyzer@v3
        with:
          fatal-infos: true

  analyze-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      - uses: bluefireteam/melos-action@v3
      - name: "Analyze with latest stable"
        uses: invertase/github-action-dart-analyzer@v3
        with:
          fatal-infos: true

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g markdownlint-cli@~0.49.0
      - run: markdownlint . -p .markdownlintignore -c .markdownlint.yaml

  dcm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      - uses: bluefireteam/melos-action@v3
      - name: Install DCM
        uses: CQLabs/setup-dcm@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run DCM
        run: dcm analyze .

  pana-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub global activate pana_workspace
      - id: list
        run: echo "packages=$(dart pub global run pana_workspace list --json)" >> "$GITHUB_OUTPUT"

  pana:
    needs: pana-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.pana-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      - name: Install the WebP tools that pana uses for screenshots
        run: sudo apt-get update && sudo apt-get install -y webp
      - uses: bluefireteam/pana_workspace@v0
        with:
          packages: ${{ matrix.package }}
  # END LINTING STAGE

  # BEGIN TESTING STAGE
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          cache: true
      - uses: bluefireteam/melos-action@v3
      - name: Run tests
        run: melos run test:select --no-select
  # END TESTING STAGE

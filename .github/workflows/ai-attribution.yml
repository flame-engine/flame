name: 'No AI Attribution'

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  main:
    name: Check for AI attribution
    runs-on: ubuntu-latest
    steps:
      - uses: bluefireteam/no-ai-attribution-action@v1

name: examples
resolution: workspace
description: A set of small examples showcasing each feature provided by the Flame Engine.
homepage: https://github.com/flame-engine/flame/tree/main/examples
publish_to: "none"

version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  collection: ^1.18.0
  crystal_ball: ^0.1.0
  flame: ^2.0.0-dev.0
  flame_audio: ^2.13.0-dev.0
  flame_forge2d: ^0.21.0-dev.0
  flame_isolate: ^0.7.0-dev.0+24
  flame_lottie: ^0.5.0-dev.0+24
  flame_noise: ^0.3.4-dev.0+24
  flame_spine: ^0.4.0-dev.0+7
  flame_svg: ^3.0.0-dev.0
  flame_test: ^3.0.0-dev.0
  flame_tiled: ^4.0.0-dev.0
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2
  jenny: ^1.5.2-dev.0
  material_ui: ^1.0.0
  meta: ^1.12.0
  padracing: ^1.0.0
  provider: ^6.1.2
  rogue_shooter: ^0.1.0
  trex_game: ^0.1.0
  url_launcher: ^6.3.0
  web: ^1.1.0
  widgetbook: ^3.25.0

dev_dependencies:
  flame_lint: ^1.4.4-dev.0
  test: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/animations/
    - assets/images/
    - assets/images/tile_maps/
    - assets/images/layers/
    - assets/images/parallax/
    - assets/images/parallax/
    - assets/images/rogue_shooter/
    - assets/spine/
    - assets/svgs/
    - assets/tiles/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/yarn/
    

name: padracing
resolution: workspace
description: A sample game featuring Flame and Forge2D for DartPad
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  collection: ^1.17.1
  flame: ^2.0.0-dev.0
  flame_forge2d: ^0.21.0-dev.0
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2
  material_ui: ^1.0.0
  url_launcher: ^6.1.11

dev_dependencies:
  flame_lint: ^1.4.4-dev.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

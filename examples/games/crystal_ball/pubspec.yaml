name: crystal_ball
resolution: workspace
description: "A game to showcase the shader pipeline API in Flame."
publish_to: 'none' 
version: "0.1.0"

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flame: ^2.0.0-dev.1
  flutter:
    sdk: flutter

  material_ui: ^1.0.0
dev_dependencies:
  flame_lint: ^1.5.0-dev.1

flutter:
  uses-material-design: true
  shaders:
    - shaders/firefly.frag
    - shaders/the_ball.frag
    - shaders/ground.frag
    - shaders/fog.frag
